name: Set up Conda and conda-lock
description: Install the lock tool separately from the Python environments under test
runs:
  using: composite
  steps:
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        activate-environment: ''
        auto-activate: false
        channels: conda-forge
        channel-priority: strict
    - name: Install conda-lock
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/conda-lock-tools"
        "$RUNNER_TEMP/conda-lock-tools/bin/python" -m pip install conda-lock==4.0.3
        echo "$RUNNER_TEMP/conda-lock-tools/bin" >> "$GITHUB_PATH"
        echo "CONDA_ENVS_PATH=$RUNNER_TEMP/zeppelin-python" >> "$GITHUB_ENV"
