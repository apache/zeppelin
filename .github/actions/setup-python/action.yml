name: Set up locked Python environment
description: Install a Conda and pip environment from its committed or candidate lock
inputs:
  environment:
    description: Conda environment and lock profile to install
    required: true
  lock-artifact:
    description: Optional same-run artifact containing candidate conda-lock files
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Download candidate Python locks
      if: ${{ inputs.lock-artifact != '' }}
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.lock-artifact }}
        path: ${{ runner.temp }}/python-lock-candidate
    - name: Use candidate Python lock
      if: ${{ inputs.lock-artifact != '' }}
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: cp -- "$RUNNER_TEMP/python-lock-candidate/$ENVIRONMENT.conda-lock.yml" "testing/locks/$ENVIRONMENT.conda-lock.yml"
    - name: Set up Conda and conda-lock
      uses: ./.github/actions/setup-conda-lock
    - name: Restore locked environment
      if: ${{ inputs.lock-artifact == '' }}
      id: environment-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/zeppelin-python/${{ inputs.environment }}
        key: ${{ runner.os }}-${{ runner.arch }}-conda-v1-${{ inputs.environment }}-${{ hashFiles(format('testing/locks/{0}.conda-lock.yml', inputs.environment)) }}
    - name: Install locked Python environment
      if: ${{ inputs.lock-artifact != '' || steps.environment-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: conda-lock install --no-mamba --name "$ENVIRONMENT" "testing/locks/$ENVIRONMENT.conda-lock.yml"
    - name: Save locked environment
      if: ${{ inputs.lock-artifact == '' && steps.environment-cache.outputs.cache-hit != 'true' && github.repository == 'apache/zeppelin' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/zeppelin-python/${{ inputs.environment }}
        key: ${{ steps.environment-cache.outputs.cache-primary-key }}
