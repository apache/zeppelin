name: Set up locked Python environment
description: Install a root Pixi environment without resolving or activating it
inputs:
  environment:
    description: Named Pixi environment to install
    required: true
runs:
  using: composite
  steps:
    - name: Install locked Python environment
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.76.2
        manifest-path: ${{ github.workspace }}/pixi.toml
        environments: ${{ inputs.environment }}
        locked: true
        activate-environment: false
        cache: true
        cache-key: python-${{ inputs.environment }}-
        cache-write: ${{ github.repository == 'apache/zeppelin' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
