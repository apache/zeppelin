name: Python dependency refresh

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-dependencies
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'apache/zeppelin'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
    steps:
      - name: Checkout fixed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require checked-in lock
        shell: bash
        run: |
          git ls-files --error-unmatch pixi.lock
          test -s pixi.lock

      - name: Set up Pixi without installing an environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          run-install: false
          cache: false

      - name: Resolve candidate lock
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/python-lock-candidate"
          pixi update --json > "${RUNNER_TEMP}/python-lock-candidate/update-report.json"

      - name: Check and retain candidate lock
        id: candidate
        shell: bash
        run: |
          test -s pixi.lock
          changed_files=$(git diff --name-only)
          if [[ -n "${changed_files}" && "${changed_files}" != 'pixi.lock' ]]; then
            echo '::error::Resolution changed files other than pixi.lock'
            printf '%s\n' "${changed_files}"
            exit 1
          fi
          git diff --check
          if git diff --quiet -- pixi.lock; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          fi
          cp pixi.lock "${RUNNER_TEMP}/python-lock-candidate/pixi.lock"

      - name: Retain candidate and resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-lock-candidate
          path: ${{ runner.temp }}/python-lock-candidate
          if-no-files-found: warn
          retention-days: 14

  validate-backends:
    needs: prepare
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/backend-tests.yml
    with:
      python-lock-artifact: python-lock-candidate

  validate-selenium:
    needs: prepare
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/selenium-integration.yml
    with:
      python-lock-artifact: python-lock-candidate

  publish:
    needs: [prepare, validate-backends, validate-selenium]
    if: >-
      needs.prepare.result == 'success' &&
      needs.validate-backends.result == 'success' &&
      needs.validate-selenium.result == 'success' &&
      needs.prepare.outputs.changed == 'true' &&
      github.repository == 'apache/zeppelin' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download validated candidate
        uses: actions/download-artifact@v7
        with:
          name: python-lock-candidate
          path: ${{ runner.temp }}/python-lock-candidate

      - name: Stage only the validated candidate
        shell: bash
        run: |
          # Keep the validated source and lock together; detached-HEAD mode rebases onto master.
          git switch -C master
          test -s "${RUNNER_TEMP}/python-lock-candidate/pixi.lock"
          cp "${RUNNER_TEMP}/python-lock-candidate/pixi.lock" pixi.lock

      - name: Publish draft dependency review
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: pixi.lock
          commit-message: Update Python dependency lock
          branch: automation/python-dependencies
          base: master
          draft: true
          title: 'CI: Update Python dependency lock'
          body: |
            Refresh `pixi.lock` within the supported versions declared in `pixi.toml`.

            The exact candidate passed the backend and Selenium compatibility tests at
            [source revision `${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).
            Review the [generation and validation run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            For reproduction instructions, see [testing/README.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/testing/README.md).
            Compatibility checks run before publication. This PR requires manual review and merge.
